<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Buscador de Productos</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      padding: 20px;
    }

    .container {
      max-width: 600px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    .container img {
      display: block;
      margin: 0 auto 20px auto;
      max-width: 200px;
      height: auto;
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
    }

    input[type="text"] {
      width: 100%;
      padding: 15px;
      font-size: 18px;
      box-sizing: border-box;
      margin-bottom: 20px;
    }

    ul {
      list-style-type: none;
      padding: 0;
    }

    li {
      padding: 10px;
      border-bottom: 1px solid #ddd;
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="https://raichu-uploads.s3.amazonaws.com/logo_prosegur_IF90AV.png">
    <h1>Buscar Productos</h1>
    <input type="text" id="searchInput" placeholder="Escribe 'climax, código, nombre de producto' para ver...">
    <ul id="productList"></ul>
  </div>

  <script src="script.js"></script>
</body>
</html>
